<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Падел · Американо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --ok: #2e9e5b;
    --warn: #d9822b;
    --danger: #d64545;
    --line: rgba(128, 128, 128, .25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  .hint { color: var(--hint); font-size: 14px; margin: 0 0 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .label { font-size: 13px; color: var(--hint); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .03em; }
  input[type=text], input[type=number] {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--btn); }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  button.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  button.danger { color: var(--danger); }
  button.wide { width: 100%; margin-top: 8px; }

  .top { margin-bottom: 10px; }
  .title { font-size: 20px; font-weight: 700; }
  .prog { color: var(--hint); font-size: 14px; margin: 2px 0 8px; }
  .bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; background: var(--btn); transition: width .25s; }
  .tabs { display: flex; gap: 6px; margin: 12px 0; }
  .tabs button { flex: 1; padding: 9px 6px; font-size: 15px; }

  .round-title { font-weight: 700; margin: 16px 2px 8px; display: flex; justify-content: space-between; }
  .round-title .done { color: var(--ok); }
  .match { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .court { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint);
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  .court .ok { color: var(--ok); }
  .court .warn { color: var(--warn); }
  .team { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .team + .team { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
  .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .score { width: 72px !important; text-align: center; font-size: 22px !important; font-weight: 700; padding: 6px !important; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; color: var(--hint); font-weight: 500; text-align: right; padding: 4px 6px; }
  td { padding: 10px 6px; text-align: right; border-top: 1px solid var(--line); }
  th:nth-child(2), td:nth-child(2) { text-align: left; width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; width: 34px; padding-left: 0; }
  td.pts { font-weight: 700; font-size: 18px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > label { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- Telegram ----------
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  // ---------- Расписание ----------
  // Для 4 и 8 игроков существует сетка, где каждый играет в паре с каждым ровно 1 раз
  // и против каждого соперника ровно 2 раза. Формат матча: [пара A, пара B]. Игроки нумеруются с 0.
  var SCHEDULES = {
    4: [
      [[[0,2],[1,3]]],
      [[[0,1],[2,3]]],
      [[[0,3],[1,2]]]
    ],
    8: [
      [[[0,7],[4,5]], [[1,3],[2,6]]],
      [[[0,4],[1,2]], [[3,6],[5,7]]],
      [[[0,2],[3,5]], [[1,4],[6,7]]],
      [[[0,3],[4,6]], [[1,7],[2,5]]],
      [[[0,6],[2,7]], [[1,5],[3,4]]],
      [[[0,1],[3,7]], [[2,4],[5,6]]],
      [[[0,5],[1,6]], [[2,3],[4,7]]]
    ]
  };

  // ---------- Хранилище ----------
  var KEY = 'padel-americano-v1';
  var memory = null;
  function load() {
    try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
    catch (e) { return memory; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { memory = JSON.parse(JSON.stringify(state)); }
  }

  // ---------- Состояние ----------
  var state = load();            // {n, names[], total, scores:{"r-m":[a,b]}}
  var draft = { n: 8, names: [], total: 24 };
  var tab = 'matches';
  var app = document.getElementById('app');
  function dn(i) { return 'Игрок ' + (i + 1); }

  // ---------- Утилиты ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function confirmAsk(msg, cb) {
    try { if (tg && tg.showConfirm) { tg.showConfirm(msg, function (ok) { if (ok) cb(); }); return; } } catch (e) {}
    if (window.confirm(msg)) cb();
  }
  function filled(sc) { return !!sc && sc[0] != null && sc[1] != null; }
  function valid(sc) { return filled(sc) && sc[0] + sc[1] === state.total; }
  function schedule() { return SCHEDULES[state.n]; }
  function matchCount() { return schedule().reduce(function (s, r) { return s + r.length; }, 0); }
  function doneCount() {
    var c = 0;
    schedule().forEach(function (round, r) {
      round.forEach(function (_, m) { if (filled(state.scores[r + '-' + m])) c++; });
    });
    return c;
  }
  function teamName(team) { return team.map(function (p) { return state.names[p]; }).join(' + '); }

  // ---------- Таблица ----------
  function standings() {
    var st = state.names.map(function (name, i) {
      return { i: i, name: name, pts: 0, against: 0, played: 0, wins: 0 };
    });
    schedule().forEach(function (round, r) {
      round.forEach(function (match, m) {
        var sc = state.scores[r + '-' + m];
        if (!filled(sc)) return;
        [[match[0], sc[0], sc[1]], [match[1], sc[1], sc[0]]].forEach(function (t) {
          t[0].forEach(function (p) {
            var s = st[p];
            s.pts += t[1]; s.against += t[2]; s.played++;
            if (t[1] > t[2]) s.wins++;
          });
        });
      });
    });
    st.sort(function (a, b) {
      return (b.pts - a.pts) ||
             ((b.pts - b.against) - (a.pts - a.against)) ||
             (b.wins - a.wins) ||
             (a.i - b.i);
    });
    return st;
  }
  function resultsText() {
    var lines = ['Падел · Американо', ''];
    standings().forEach(function (s, idx) {
      lines.push((idx + 1) + '. ' + s.name + ' — ' + s.pts + ' оч. (' + s.wins + ' поб. из ' + s.played + ')');
    });
    return lines.join('\n');
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Скопировано'); }, fallback);
    } else fallback();
  }

  // ---------- Экран настройки ----------
  function renderSetup() {
    var n = draft.n;
    var rounds = SCHEDULES[n].length;
    var segBtns = [4, 8].map(function (v) {
      return h('button', { class: v === n ? 'active' : '', onclick: function () { draft.n = v; renderSetup(); } }, v + ' игрока');
    });
    var inputs = [];
    for (var i = 0; i < n; i++) (function (i) {
      inputs.push(h('input', {
        type: 'text', maxlength: 20, placeholder: dn(i), value: draft.names[i] || '',
        oninput: function (e) { draft.names[i] = e.target.value; }
      }));
    })(i);

    app.replaceChildren(
      h('h1', null, 'Падел · Американо'),
      h('p', { class: 'hint' }, 'Каждый играет в паре с каждым по разу и против каждого соперника по два раза.'),
      h('div', { class: 'card' },
        h('div', { class: 'label' }, 'Количество игроков'),
        h('div', { class: 'seg' }, segBtns),
        h('p', { class: 'hint', style: 'margin:8px 0 0' }, rounds + ' раундов · ' + (rounds * n / 4) + ' матчей')
      ),
      h('div', { class: 'card' },
        h('div', { class: 'label' }, 'Имена игроков'),
        h('div', { class: 'names' }, inputs)
      ),
      h('div', { class: 'card' },
        h('div', { class: 'label' }, 'Очков в одном матче'),
        h('input', { type: 'number', inputmode: 'numeric', min: 1, max: 99, value: draft.total,
          oninput: function (e) { draft.total = parseInt(e.target.value, 10) || 0; } })
      ),
      h('button', { class: 'primary wide', onclick: startTournament }, 'Начать турнир')
    );
  }

  function startTournament() {
    if (!(draft.total >= 1)) { toast('Укажите число очков в матче'); return; }
    var names = [];
    for (var i = 0; i < draft.n; i++) names.push((draft.names[i] || '').trim() || dn(i));
    state = { n: draft.n, names: names, total: draft.total, scores: {} };
    save(); tab = 'matches'; render();
  }

  // ---------- Экран турнира ----------
  function renderTournament() {
    var total = matchCount();
    var done = doneCount();
    var tabs = h('div', { class: 'tabs' },
      [['matches', 'Матчи'], ['table', 'Таблица'], ['settings', 'Ещё']].map(function (t) {
        return h('button', { class: tab === t[0] ? 'active' : '', onclick: function () { tab = t[0]; renderTournament(); window.scrollTo(0, 0); } }, t[1]);
      })
    );
    var view = tab === 'matches' ? viewMatches() : tab === 'table' ? viewTable() : viewSettings();
    app.replaceChildren(
      h('div', { class: 'top' },
        h('div', { class: 'title' }, 'Падел · Американо'),
        h('div', { class: 'prog', id: 'prog' }, 'Сыграно ' + done + ' из ' + total + ' · до ' + state.total + ' очков'),
        h('div', { class: 'bar' }, h('div', { class: 'fill', id: 'fill', style: 'width:' + (done / total * 100) + '%' }))
      ),
      tabs,
      view
    );
  }

  function updateProgress() {
    var total = matchCount(), done = doneCount();
    var p = document.getElementById('prog'), f = document.getElementById('fill');
    if (p) p.textContent = 'Сыграно ' + done + ' из ' + total + ' · до ' + state.total + ' очков';
    if (f) f.style.width = (done / total * 100) + '%';
  }

  function statusFor(sc) {
    if (!filled(sc)) return { text: '', cls: '' };
    if (valid(sc)) return { text: '✓', cls: 'ok' };
    return { text: '⚠ сумма ' + (sc[0] + sc[1]) + ' ≠ ' + state.total, cls: 'warn' };
  }
  function refreshStatus(r, m) {
    var el = document.getElementById('st-' + r + '-' + m);
    if (!el) return;
    var s = statusFor(state.scores[r + '-' + m]);
    el.textContent = s.text; el.className = s.cls;
    var rh = document.getElementById('rh-' + r);
    if (rh) {
      var all = schedule()[r].every(function (_, mm) { return valid(state.scores[r + '-' + mm]); });
      rh.textContent = all ? '✓ готов' : '';
    }
  }

  function onScore(r, m, side, input) {
    var key = r + '-' + m;
    var raw = input.value.trim();
    var v = raw === '' ? null : Math.max(0, Math.min(99, parseInt(raw, 10)));
    if (v !== null && isNaN(v)) v = null;
    var cur = state.scores[key] || [null, null];
    var other = 1 - side;
    var sib = input.closest('.match').querySelectorAll('input')[other];
    cur[side] = v;
    if (v === null) { cur[other] = null; sib.value = ''; }
    else if (v <= state.total) { cur[other] = state.total - v; sib.value = cur[other]; }
    state.scores[key] = cur;
    if (cur[0] == null && cur[1] == null) delete state.scores[key];
    save(); refreshStatus(r, m); updateProgress();
  }

  function viewMatches() {
    var box = h('div');
    schedule().forEach(function (round, r) {
      var rDone = round.every(function (_, m) { return valid(state.scores[r + '-' + m]); });
      box.appendChild(h('div', { class: 'round-title' },
        h('span', null, 'Раунд ' + (r + 1)),
        h('span', { class: 'done', id: 'rh-' + r }, rDone ? '✓ готов' : '')
      ));
      round.forEach(function (match, m) {
        var sc = state.scores[r + '-' + m] || [null, null];
        var st = statusFor(state.scores[r + '-' + m]);
        function inp(side) {
          return h('input', {
            class: 'score', type: 'number', inputmode: 'numeric', pattern: '[0-9]*', min: 0, max: 99,
            placeholder: '–', value: sc[side] == null ? '' : sc[side],
            oninput: function (e) { onScore(r, m, side, e.target); }
          });
        }
        box.appendChild(h('div', { class: 'match' },
          h('div', { class: 'court' }, h('span', null, 'Корт ' + (m + 1)), h('span', { id: 'st-' + r + '-' + m, class: st.cls }, st.text)),
          h('div', { class: 'team' }, h('span', { class: 'tn' }, teamName(match[0])), inp(0)),
          h('div', { class: 'team' }, h('span', { class: 'tn' }, teamName(match[1])), inp(1))
        ));
      });
    });
    return box;
  }

  function viewTable() {
    var medals = ['🥇', '🥈', '🥉'];
    var rows = standings().map(function (s, idx) {
      return h('tr', null,
        h('td', null, s.pts > 0 && idx < 3 ? medals[idx] : String(idx + 1)),
        h('td', null, s.name),
        h('td', { class: 'pts' }, String(s.pts)),
        h('td', null, String(s.played)),
        h('td', null, String(s.wins)),
        h('td', null, (s.pts - s.against > 0 ? '+' : '') + (s.pts - s.against))
      );
    });
    return h('div', null,
      h('div', { class: 'card' },
        h('table', null,
          h('thead', null, h('tr', null,
            h('th', null, '#'), h('th', null, 'Игрок'), h('th', null, 'Очки'),
            h('th', null, 'Игр'), h('th', null, 'Поб'), h('th', null, '+/−'))),
          h('tbody', null, rows)
        )
      ),
      h('p', { class: 'hint' }, 'Очки игрока — сумма очков его пары во всех матчах. При равенстве — разница очков, затем победы.')
    );
  }

  function viewSettings() {
    var nameInputs = state.names.map(function (name, i) {
      return h('input', { type: 'text', maxlength: 20, value: name,
        oninput: function (e) { state.names[i] = e.target.value.trim() || dn(i); save(); } });
    });
    return h('div', null,
      h('div', { class: 'card' },
        h('div', { class: 'label' }, 'Имена игроков'),
        h('div', { class: 'names' }, nameInputs),
        h('p', { class: 'hint', style: 'margin:8px 0 0' }, 'Изменения применятся при следующем переходе на вкладку.')
      ),
      h('div', { class: 'card' },
        h('div', { class: 'label' }, 'Очков в одном матче'),
        h('input', { type: 'number', inputmode: 'numeric', min: 1, max: 99, value: state.total,
          oninput: function (e) {
            var v = parseInt(e.target.value, 10);
            if (v >= 1) { state.total = v; save(); }
          } }),
        h('p', { class: 'hint', style: 'margin:8px 0 0' }, 'Влияет на автоподстановку счёта второй пары и проверку суммы.')
      ),
      h('button', { class: 'primary wide', onclick: function () { copyText(resultsText()); } }, 'Скопировать итоги'),
      h('button', { class: 'wide danger', onclick: function () {
        confirmAsk('Удалить текущий турнир и начать новый?', function () {
          state = null; try { localStorage.removeItem(KEY); } catch (e) {} memory = null;
          draft = { n: 8, names: [], total: 24 }; render();
        });
      } }, 'Новый турнир')
    );
  }

  function render() { if (state && SCHEDULES[state.n]) renderTournament(); else renderSetup(); }
  render();
})();
</script>
</body>
</html>
